name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structure, scope, base paths, size
        run: |
          INFRA=""
          if ${{ contains(github.event.pull_request.labels.*.name, 'infra') }}; then INFRA=infra; fi
          bash scripts/check.sh "${{ github.event.pull_request.base.sha }}" "$INFRA"
      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}
            --exclude-path edf-redirect
            './**/*.html'
          fail: true
